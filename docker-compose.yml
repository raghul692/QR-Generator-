version: '3.8'

services:
  # ===== PostgreSQL Database (Local Dev Mirror of Supabase PostgreSQL) =====
  db:
    image: postgres:16-alpine
    container_name: qrmaster_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qrmaster_pro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ===== FastAPI Backend =====
  backend:
    build: ./backend
    container_name: qrmaster_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/qrmaster_pro
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - PUBLIC_REDIRECT_BASE_URL=http://localhost:8000
      - DEBUG=true
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app

  # ===== React Frontend =====
  frontend:
    build: ./frontend
    container_name: qrmaster_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
